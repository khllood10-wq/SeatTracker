name: Build httpcloak AAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout httpcloak
        uses: actions/checkout@v4
        with:
          repository: sardanioss/httpcloak
          ref: main

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 28
        run: |
          sdkmanager --install "ndk;28.0.13004108"

      - name: Build AAR
        run: |
          cd bindings/android
          ./gradlew :httpcloak:assembleRelease

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: httpcloak-android-aar
          path: bindings/android/httpcloak/build/outputs/aar/*.aar
