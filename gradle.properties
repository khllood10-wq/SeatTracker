# ═══════════════════════════════════════════════════════
#   Gradle Properties - SaudiaSeatTracker
# ═══════════════════════════════════════════════════════

# ذاكرة JVM أكبر + في-process compilation (يمنع انهيار daemon)
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# لا daemon (سيبني البناء في نفس العملية بدون subprocess)
org.gradle.daemon=false

# لا تنفيذ متوازي (يوفر ذاكرة)
org.gradle.parallel=false

# تفعيل cache للبناءات المتكررة
org.gradle.caching=true

# Kotlin compiler داخل نفس عملية Gradle (الحل الأساسي للانهيار)
kotlin.compiler.execution.strategy=in-process

# AndroidX
android.useAndroidX=true

# نمط Kotlin الرسمي
kotlin.code.style=official

# لا R8 كامل في debug (أسرع بناء)
android.enableJetifier=false
